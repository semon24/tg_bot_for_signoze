services:
  sygnoz_bot:  
    image: vneocheredi:latest
    ports:
      - "5000:50"
    depends_on:
      - db

  db:      
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alerts
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"

volumes:
  postgres_data: 